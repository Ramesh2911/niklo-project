        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/packages {
        proxy_pass http://ltmzir9qa389f53ho5hkzlq0.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # plural prefix = consumer routes; singular = partner-panel routes
    location /api/v1/adventures {
        proxy_pass http://ra0qdnh3xfolrfu1y82bva9g.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/adventure {
        proxy_pass http://ra0qdnh3xfolrfu1y82bva9g.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/notifications {
        proxy_pass http://l2pdf6ail6mlmurxhtjjf44i.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/notify {
        proxy_pass http://l2pdf6ail6mlmurxhtjjf44i.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/driver {
        proxy_pass http://ebzdp7jvp5z5bhrl05tkvxsa.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/ai-planner {
        proxy_pass http://s3knzzbxvavkb4t218hgb9nh.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ride-service Socket.IO gateway (unused by the SPA today, kept for parity
    # with vite.config.ts:67)
    location /socket.io {
        proxy_pass http://my41fssoetuy2w34a2yettfe.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # catch-all /api/* -> central nginx gateway (vercel.json:122-124)
    location /api/ {
        proxy_pass http://irtucumwj9akelon0k4iyatv.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ---- static assets ----

    # Vite emits content-hashed files under /assets/ — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys propagate
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all other routes serve the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
