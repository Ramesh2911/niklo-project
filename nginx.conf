# Niklo frontend — served by the nginx:alpine runtime stage of the Dockerfile.
# This mirrors the dev proxy in vite.config.ts and the rewrites in vercel.json:
# every /api/v1/* prefix is reverse-proxied to its backend service, and all
# other paths fall back to index.html (React Router BrowserRouter).
#
# proxy_pass is used WITHOUT a trailing URI so the original request path is
# forwarded unchanged to the backend.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- shared proxy settings (repeated per location via include-less copy)
    # Longest-prefix matching handles overlapping routes, e.g.
    #   /api/v1/bookings/hotel  -> hotel-service (longer) over /api/v1/bookings
    #   /api/v1/user/active-trip-> booking-service over /api/v1/user

    location /api/v1/auth {
        proxy_pass http://szs601uiqefhc8jbpeq587f3.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/users {
        proxy_pass http://f11slpsqn3bkula8r1yr292u.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/user/active-trip {
        proxy_pass http://yjfbvszz8e2yv5sefwcpxye4.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/user {
        proxy_pass http://f11slpsqn3bkula8r1yr292u.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/wishlist {
        proxy_pass http://f11slpsqn3bkula8r1yr292u.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/ride {
        proxy_pass http://my41fssoetuy2w34a2yettfe.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/bus {
        proxy_pass http://w1n68oxs2na9q9tbveqsqa4s.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/payment {
        proxy_pass http://n13chiypv5vg517ffvioht20.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/hotels {
        proxy_pass http://b5m0ntg98i0cpdaidmcvdqwd.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/location {
        proxy_pass http://b5m0ntg98i0cpdaidmcvdqwd.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # hotel-created bookings live on hotel-service (see vite.config.ts:60)
    location /api/v1/bookings/hotel {
        proxy_pass http://b5m0ntg98i0cpdaidmcvdqwd.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/bookings {
        proxy_pass http://yjfbvszz8e2yv5sefwcpxye4.187.127.157.13.sslip.io;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/offers {
        proxy_pass http://yjfbvszz8e2yv5sefwcpxye4.187.127.157.13.sslip.io;
